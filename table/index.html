<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f3b3a">
  <title>Tile Rummy · Table</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/table.css">
</head>
<body>
  <div id="boot" class="boot">Opening the table…</div>

  <section id="lobby" class="lobby" hidden>
    <div class="lobby-join">
      <h1 class="logo">Tile Rummy</h1>
      <p class="lead">Scan to join on your phone</p>
      <div id="qr" class="qr"></div>
      <p class="or">or open <b id="joinUrl"></b> and enter</p>
      <div id="roomCode" class="room-code"></div>
    </div>
    <div class="lobby-side">
      <h2>Players <span id="playerCount" class="muted"></span></h2>
      <ul id="lobbyPlayers" class="lobby-players"></ul>
      <button id="addBotBtn" class="btn ghost add-bot">＋ Add bot</button>
      <div class="setting">
        <span>Turn timer</span>
        <div id="timerOptions" class="seg" role="radiogroup" aria-label="Turn timer"></div>
      </div>
      <div class="setting">
        <span>Strict joker rule<small class="setting-help">Jokers on the table can only be taken by swapping in the exact tile</small></span>
        <div id="jokerOptions" class="seg" role="radiogroup" aria-label="Strict joker rule">
          <button role="radio" data-strict="1">On</button>
          <button role="radio" data-strict="0">Off</button>
        </div>
      </div>
      <button id="startBtn" class="btn primary big" disabled>Start game</button>
      <p id="lobbyHint" class="muted small"></p>
      <button id="resetBtn" class="btn ghost small-btn">New table (new code)</button>
    </div>
  </section>

  <section id="game" class="game" hidden>
    <aside class="sidebar">
      <div class="side-top">
        <div class="logo small">Tile Rummy</div>
        <div class="side-code">Room <b id="sideCode"></b></div>
      </div>
      <ul id="players" class="players"></ul>
      <div class="pool">
        <div class="pool-stack" aria-hidden="true"><i></i><i></i><i></i></div>
        <div><b id="poolCount">0</b><span>tiles to draw</span></div>
      </div>
      <button id="endRoundBtn" class="btn ghost small-btn" hidden>End round now…</button>
      <button id="menuBtn" class="btn ghost small-btn">Back to lobby…</button>
    </aside>
    <main id="board" class="board">
      <div class="board-head">
        <div id="turnName" class="turn-name"></div>
        <div id="turnClock" class="turn-clock" hidden></div>
        <div id="pendingTimer" class="pending-timer" hidden></div>
        <button id="settingsBtn" class="gear-btn" aria-label="Game settings" aria-haspopup="dialog" aria-expanded="false" aria-controls="settingsPanel"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.4 7.4 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.4 7.4 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.4 7.4 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.4 7.4 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></button>
      </div>
      <div id="boardInner" class="board-inner"></div>
      <div id="banner" class="banner" aria-live="polite"></div>
      <div id="celebrate" class="celebrate" hidden aria-hidden="true"></div>
      <div id="settingsPanel" class="settings-panel" role="dialog" aria-label="Game settings" hidden>
        <div class="sp-head">
          <h3>Turn timer</h3>
          <button id="settingsClose" class="sp-close" aria-label="Close settings">✕</button>
        </div>
        <div id="gameTimerOptions" class="seg big-seg" role="radiogroup" aria-label="Turn timer"></div>
        <p id="timerNote" class="sp-note"></p>
        <div class="sp-bar" aria-hidden="true"><i id="spBar"></i></div>
      </div>
    </main>
    <div id="netStatus" class="net-status" hidden></div>
  </section>

  <div id="roundOver" class="overlay" hidden>
    <div class="overlay-card">
      <h2 id="roWinner"></h2>
      <p id="roReason" class="muted"></p>
      <table class="scores">
        <thead><tr><th>Place</th><th>Player</th><th>Finish</th><th>This round</th><th>Total</th></tr></thead>
        <tbody id="roRows"></tbody>
      </table>
      <p id="roScoring" class="muted ro-scoring"></p>
      <div class="overlay-actions">
        <button id="nextRoundBtn" class="btn primary big">Next round</button>
        <button id="toLobbyBtn" class="btn ghost">Back to lobby</button>
      </div>
    </div>
  </div>

  <div id="soundCtl" class="sound-ctl">
    <button id="soundBtn" class="sound-btn" aria-label="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span id="soundLbl">Tap to enable sound</span></button>
    <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Volume">
  </div>

  <script type="module" src="../js/table/main.js"></script>
</body>
</html>
