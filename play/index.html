<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f3b3a">
  <meta name="format-detection" content="telephone=no">
  <title>Tile Rummy</title>
  <link rel="icon" href="../icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="../css/play.css">
</head>
<body>
  <!-- Join -->
  <section id="join" class="screen join" hidden>
    <h1 class="logo">Tile Rummy</h1>
    <form id="joinForm" autocomplete="off">
      <label>Room code
        <input id="codeInput" name="code" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" maxlength="4" placeholder="ABCD" required>
      </label>
      <label>Your name
        <input id="nameInput" name="name" maxlength="16" autocorrect="off" placeholder="Name" required>
      </label>
      <button id="joinBtn" class="btn primary big" type="submit">Join table</button>
      <p id="diag" class="diag" role="status" aria-live="polite" hidden><span class="dot"></span><span id="diagText"></span></p>
      <button id="cancelJoin" class="btn ghost" type="button" hidden>Cancel</button>
      <p id="joinError" class="join-error" role="alert"></p>
    </form>
  </section>

  <!-- Connecting / waiting / messages -->
  <section id="wait" class="screen wait" hidden>
    <div class="wait-card">
      <div id="waitIcon" class="spinner" aria-hidden="true"></div>
      <h2 id="waitTitle">Connecting…</h2>
      <p id="waitText" class="muted"></p>
      <ul id="waitPlayers" class="wait-players"></ul>
      <p id="waitDiag" class="diag" role="status" aria-live="polite" hidden><span class="dot"></span><span></span></p>
      <div class="settings-row">
        <button class="chip" data-toggle="sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="lbl">Sound on</span></button>
        <button class="chip" data-toggle="haptics"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path class="wave" d="M4.5 8v8M1.8 10v4M19.5 8v8M22.2 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg><span class="lbl">Vibration on</span></button>
      </div>
      <button id="leaveBtn" class="btn ghost">Leave</button>
    </div>
  </section>

  <!-- Game -->
  <section id="game" class="screen game" hidden>
    <header class="top">
      <span id="connDot" class="dot on"></span>
      <div class="turn"><b id="turnText"></b><span id="subText" class="muted"></span></div>
      <span id="timer" class="timer" hidden></span>
      <span class="pool-pill" title="Tiles left to draw"><i></i><b id="poolCount">0</b></span>
      <button class="icon-btn" data-toggle="sound" aria-label="Sound"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" data-toggle="haptics" aria-label="Vibration"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="3" width="8" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path class="wave" d="M4.5 8v8M1.8 10v4M19.5 8v8M22.2 10v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="slash" d="M3 3l18 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </header>
    <div id="offline" class="offline" hidden role="status" aria-live="polite">Reconnecting… your rack is safe.</div>
    <div id="finishedStrip" class="finished-strip" hidden></div>

    <main id="boardArea" class="board-area">
      <div id="sets" class="sets"></div>
      <div id="newSet" class="new-set">＋ New set: drop or tap here</div>
    </main>

    <div id="info" class="info" aria-live="polite"></div>

    <section id="rackArea" class="rack-area">
      <div class="rack-tools">
        <button id="sortColor" class="chip">Sort by color</button>
        <button id="sortNumber" class="chip">Sort by number</button>
        <span id="rackCount" class="muted rack-count"></span>
      </div>
      <div id="rack" class="rack"></div>
    </section>

    <footer class="actions">
      <button id="resetBtn" class="btn">Reset</button>
      <button id="drawBtn" class="btn">Draw</button>
      <button id="commitBtn" class="btn primary">Commit</button>
    </footer>
  </section>

  <!-- Round over -->
  <section id="over" class="screen wait" hidden>
    <div class="wait-card">
      <h2 id="overTitle"></h2>
      <p id="overText"></p>
      <ul id="overScores" class="wait-players"></ul>
      <p class="muted">Waiting for the table to start the next round…</p>
    </div>
  </section>

  <div id="turnFlash" class="turn-flash" hidden aria-hidden="true"><div class="turn-flash-banner">Your turn</div></div>
  <div id="caret" class="caret" hidden></div>
  <script type="module" src="../js/play/main.js"></script>
</body>
</html>
