<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tile Rummy · Test bench</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #0a1716; color: #cfe; font: 14px system-ui, sans-serif; }
    body { display: grid; grid-template-rows: auto 1fr; }
    header { display: flex; gap: 14px; align-items: center; padding: 8px 14px; flex-wrap: wrap; }
    header b { color: #fff; }
    header label { display: flex; gap: 6px; align-items: center; }
    header button, header select { font: inherit; padding: 4px 10px; border-radius: 6px; border: 0; }
    .wrap { display: grid; grid-template-columns: 1fr; grid-template-rows: minmax(0, 1fr) auto; gap: 10px; padding: 0 10px 10px; min-height: 0; }
    .table { min-height: 0; }
    .table iframe { width: 100%; height: 100%; border: 0; border-radius: 10px; background: #000; }
    .phones { display: flex; gap: 10px; overflow-x: auto; }
    .phone { flex: none; display: grid; gap: 4px; }
    .phone span { font-size: 12px; color: #9bb; }
    .phone iframe { width: 300px; height: 620px; border: 0; border-radius: 22px; box-shadow: 0 0 0 6px #222; background: #000; }
  </style>
</head>
<body>
  <header>
    <b>Test bench</b>
    <span>Table and phones talk over BroadcastChannel (<code>?net=local</code>), so this works offline.</span>
    <label>Phones <select id="n"><option>2</option><option selected>3</option><option>4</option></select></label>
    <button id="restart">Restart everything</button>
  </header>
  <div class="wrap">
    <div class="table"><iframe id="table" title="Table"></iframe></div>
    <div class="phones" id="phones"></div>
  </div>
  <script>
    const names = ['Ana', 'Ben', 'Cleo', 'Dev'];
    const code = 'TEST';
    const n = document.getElementById('n');
    const saved = Number(localStorage.getItem('tilerummy:bench:n')) || 3;
    n.value = String(saved);
    function load(fresh) {
      if (fresh) {
        for (const k of Object.keys(localStorage)) if (k.startsWith('tilerummy:') && !k.startsWith('tilerummy:bench')) localStorage.removeItem(k);
      }
      document.getElementById('table').src = `table/?net=local&code=${code}`;
      const box = document.getElementById('phones');
      box.innerHTML = '';
      for (let i = 0; i < Number(n.value); i++) {
        const d = document.createElement('div');
        d.className = 'phone';
        d.innerHTML = `<span>Phone ${i + 1}: ${names[i]}</span><iframe title="Phone ${i + 1}"></iframe>`;
        box.appendChild(d);
        // Stagger joins so seat order is predictable.
        setTimeout(() => {
          d.querySelector('iframe').src = `play/?net=local&room=${code}&slot=${i + 1}&name=${names[i]}&autojoin=1`;
        }, 600 + i * 250);
      }
    }
    n.addEventListener('change', () => { localStorage.setItem('tilerummy:bench:n', n.value); load(true); });
    document.getElementById('restart').addEventListener('click', () => load(true));
    load(false);
  </script>
</body>
</html>
